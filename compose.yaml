services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sprout
      POSTGRES_DB: sprout
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请配置DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprout -d sprout"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_DRIVER: postgres
      DATABASE_URL: postgres://sprout:${DB_PASSWORD:?请配置DB_PASSWORD}@db:5432/sprout
      WX_APP_ID: wxa2a5f23a2973420e
      WX_APP_SECRET: ${WX_APP_SECRET:?请配置WX_APP_SECRET}
      JWT_SECRET: ${JWT_SECRET:?请配置JWT_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - photos:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres-data:
  photos:
